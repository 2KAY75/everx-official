<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin EVERX</title><style>body{background:#050505;color:#fff;font-family:sans-serif;padding:12px;max-width:700px;margin:0 auto}.card{background:#111;border:1px solid #222;padding:14px;border-radius:12px;margin:10px 0}.inp{width:100%;background:#000;border:1px solid #333;color:#fff;padding:11px;border-radius:10px;margin:6px 0}.btn{padding:10px 14px;border:none;border-radius:10px;font-weight:700}.gold{background:#D4AF37;color:#000}.green{background:#22c55e;color:#fff}.red{background:#ef4444;color:#fff}</style></head><body><h1 style="color:#D4AF37">👑 EVERX ADMIN</h1><div id="lock"><input class="inp" id="pin" type="password" placeholder="PIN 1234"><button class="btn gold" style="width:100%" onclick="if(document.getElementById('pin').value=='1234'){document.getElementById('lock').style.display='none';document.getElementById('dash').style.display='block';load()}else alert('Wrong PIN')">Unlock</button></div><div id="dash" style="display:none"><b id="stats"></b><input class="inp" id="q" placeholder="Search email / ID / Steam" oninput="load()"><h3>📦 Trades to Review</h3><div id="trades"></div><h3>✅ KYC Requests</h3><div id="kyc"></div><h3>👥 Users</h3><div id="users"></div><div class="card"><button class="btn gold" style="width:100%" onclick="location='/api/export_csv'">📥 Export CSV ALL TIME</button></div></div><script>let D={};async function load(){let r=await fetch('/api/admin_all');D=await r.json();let q=document.getElementById('q').value.toLowerCase();let f=D.trades.filter(t=>(t.email+' '+t.card+' '+t.id).toLowerCase().includes(q));document.getElementById('stats').innerText=`Pending: ${D.trades.filter(t=>t.status=='Pending').length} | Users: ${D.users.length}`;document.getElementById('trades').innerHTML=f.slice(-30).reverse().map((t,i)=>{let idx=D.trades.indexOf(t);return `<div class="card"><b>${t.id} | ${t.card} $${t.balance} = ₦${t.total.toLocaleString()}</b><div>${t.email} • ${t.country} • ${t.cardType}</div><div>Bank: ${t.bank} ${t.account} (${t.accName}) • Code: ${t.code}</div><div>Status: <b>${t.status}</b> • ${t.date.slice(0,16)}</div><div style="display:flex;gap:6px;margin-top:6px"><button class="btn green" onclick="setS(${idx},'Paid')">✅ Approve & Paid</button><button class="btn gold" onclick="setS(${idx},'Verifying')">🟡 Verifying</button><button class="btn red" onclick="setS(${idx},'Rejected')">❌ Reject</button></div></div>`}).join('')||'No trades';document.getElementById('kyc').innerHTML=D.kyc.map((k,i)=>`<div class="card">${k.name} • ${k.email} • ${k.idType} ${k.idNum} • <b>${k.status}</b> <button class="btn green" onclick="kycS(${i},'Approved')">Approve KYC</button></div>`).join('')||'No KYC';document.getElementById('users').innerHTML=D.users.map(u=>`<div>${u.name} • ${u.email} • KYC: ${u.kyc} • Ref: ${u.refCode}</div>`).join('')||'No users';}async function setS(i,s){await fetch('/api/set_status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:i,status:s})});load();}async function kycS(i,s){await fetch('/api/approve_kyc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:i,status:s})});load();}</script></body></html>
